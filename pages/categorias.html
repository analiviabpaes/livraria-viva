<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria Viva | Categorias</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-pagina="categorias">

  <header class="cabecalho">
    <h1 class="logo">Livraria Viva</h1>
  </header>

  <nav class="menu">
    <a href="../index.html">Home</a>
    <a href="livros.html">Livros</a>
    <a href="categorias.html" class="ativo">Categorias</a>
    <a href="usuarios.html">Usuários</a>
    <a href="pedidos.html">Pedidos</a>
  </nav>

  <main>
    <p id="msg" style="font-weight: bold; margin: 16px 0;"></p>

    <section class="formulario">
      <h3>Cadastrar / Editar Categoria</h3>
      <form id="form">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao" name="descricao" >
        <button type="submit" class="botao">Salvar</button>
        <button type="button" class="botao botao-danger cancelar" style="display: none;">Cancelar edição</button>
      </form>
    </section>

    <section style="margin-top: 30px;">
      <h3>Categorias Cadastradas</h3>
      <table class="tabela-dados">
        <thead><tr><th>ID</th><th>Nome</th><th>Descrição</th><th>Ações</th></tr></thead>
        <tbody id="lista"></tbody>
      </table>
    </section>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 Livraria Viva — Todos os direitos reservados.</p>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
