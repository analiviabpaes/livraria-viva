<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria Viva | Livros</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-pagina="livros">

  <header class="cabecalho">
    <h1 class="logo">Livraria Viva</h1>
  </header>

  <nav class="menu">
    <a href="../index.html">Home</a>
    <a href="livros.html" class="ativo">Livros</a>
    <a href="categorias.html">Categorias</a>
    <a href="usuarios.html">Usuários</a>
    <a href="pedidos.html">Pedidos</a>
  </nav>

  <main>
    <section class="galeria-livros">
      <h2 class="titulo-pagina">Nosso Catálogo</h2>
      <input type="text" id="busca" class="busca" placeholder="Pesquisar por título do livro...">
      <div class="grade-livros" id="lista"></div>
    </section>

    <p id="msg" style="font-weight: bold; margin: 16px 0;"></p>

    <section class="formulario">
      <h3>Cadastrar / Editar Livro</h3>
      <form id="form">
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" required>
        <label for="autor">Autor(a):</label>
        <input type="text" id="autor" name="autor" required>
        <label for="preco">Preço (R$):</label>
        <input type="number" id="preco" name="preco" step="0.01" min="0" required>
        <label for="estoque">Estoque:</label>
        <input type="number" id="estoque" name="estoque" min="0" value="0" required>
        <label for="id_categoria">Categoria:</label>
        <select id="id_categoria" name="id_categoria" required></select>
        <button type="submit" class="botao">Salvar</button>
        <button type="button" class="botao botao-danger cancelar" style="display: none;">Cancelar edição</button>
      </form>
    </section>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 Livraria Viva — Todos os direitos reservados.</p>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
