<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria Viva | Usuários</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-pagina="usuarios">

  <header class="cabecalho">
    <h1 class="logo">Livraria Viva</h1>
  </header>

  <nav class="menu">
    <a href="../index.html">Home</a>
    <a href="livros.html">Livros</a>
    <a href="categorias.html">Categorias</a>
    <a href="usuarios.html" class="ativo">Usuários</a>
    <a href="pedidos.html">Pedidos</a>
  </nav>

  <main>
    <p id="msg" style="font-weight: bold; margin: 16px 0;"></p>

    <section class="formulario">
      <h3>Cadastrar / Editar Usuário</h3>
      <form id="form">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>
        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" name="telefone" >
        <button type="submit" class="botao">Salvar</button>
        <button type="button" class="botao botao-danger cancelar" style="display: none;">Cancelar edição</button>
      </form>
    </section>

    <section style="margin-top: 30px;">
      <h3>Usuários Cadastrados</h3>
      <table class="tabela-dados">
        <thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Ações</th></tr></thead>
        <tbody id="lista"></tbody>
      </table>
    </section>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 Livraria Viva — Todos os direitos reservados.</p>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
